worker_processes auto;
events { worker_connections 1024; }

http {
    sendfile on;
    client_max_body_size 100M;

    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream rag_api {
        server api:8000 max_fails=3 fail_timeout=5s;
        keepalive 32;
    }

    upstream rag_web {
        server web:3000;
        keepalive 32;
    }

    # Allow Next.js HMR websocket
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name _;

        location /healthz {
            access_log off;
            return 200 "ok\n";
        }

        # Backend API — note the trailing slash on proxy_pass strips /api/
        location /api/ {
            proxy_pass         http://rag_api/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # Next.js (everything else, including HMR ws on /_next/webpack-hmr)
        location / {
            proxy_pass         http://rag_web;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade;
            proxy_read_timeout 120s;
        }
    }
}
